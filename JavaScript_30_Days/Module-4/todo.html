<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .app {
            width: 400px;
            background: white;

            padding: 25px;
            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        #taskInput {
            flex: 1;
            padding: 10px;

            border: 1px solid #ccc;
            border-radius: 5px;

            outline: none;
        }

        #taskInput:focus {
            border-color: #333;
        }

        #addBtn {
            padding: 10px 18px;

            border: none;
            border-radius: 5px;

            background: #333;
            color: white;

            cursor: pointer;
        }

        #addBtn:hover {
            background: #555;
        }

        #taskList {
            margin-top: 20px;
            list-style: none;
        }

        #taskList li {
            background: #f1f1f1;

            padding: 10px;
            margin-bottom: 8px;

            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>My ToDo App</h1>

        <div class="input-row">

            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a task..."
            >

            <button id="addBtn">
                Add
            </button>

        </div>

        <ul id="taskList">
        </ul>

    </div>

    <!-- <script src="app.js"></script> -->
    <script src="todo.js"></script>

</body>

</html>
